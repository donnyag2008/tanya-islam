<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#080b10"/>

  <!-- geometric pattern -->
  <defs>
    <pattern id="geo" width="60" height="60" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#c9a84c" stroke-width="0.6" opacity="0.08">
        <polygon points="30,2 56,18 56,42 30,58 4,42 4,18"/>
        <polygon points="30,10 50,22 50,38 30,50 10,38 10,22"/>
      </g>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#geo)"/>

  <!-- gold line top -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#c9a84c" stroke-width="3"/>

  <!-- crescent -->
  <text x="600" y="230" font-size="100" text-anchor="middle" fill="#c9a84c">☪</text>

  <!-- title -->
  <text x="600" y="310" font-size="64" font-weight="500" text-anchor="middle" fill="#c9a84c" font-family="Georgia, serif" letter-spacing="6">Tanya Islam</text>

  <!-- arabic -->
  <text x="600" y="365" font-size="32" text-anchor="middle" fill="#7a6a4a" font-family="Georgia, serif">اسأل عن الإسلام</text>

  <!-- subtitle -->
  <text x="600" y="420" font-size="20" text-anchor="middle" fill="#4a4030" font-family="Arial, sans-serif" letter-spacing="3">QURAN · HADITH · SCHOLARS · EN / ID</text>

  <!-- pill tags -->
  <rect x="310" y="455" width="160" height="36" rx="18" fill="#1a1508" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>
  <text x="390" y="478" font-size="14" text-anchor="middle" fill="#c9a84c" font-family="Arial, sans-serif">Islamic Q&amp;A</text>

  <rect x="520" y="455" width="160" height="36" rx="18" fill="#1a1508" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>
  <text x="600" y="478" font-size="14" text-anchor="middle" fill="#c9a84c" font-family="Arial, sans-serif">Halal Checker</text>

  <rect x="730" y="455" width="160" height="36" rx="18" fill="#1a1508" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>
  <text x="810" y="478" font-size="14" text-anchor="middle" fill="#c9a84c" font-family="Arial, sans-serif">Free · AI-Powered</text>

  <!-- url -->
  <text x="600" y="570" font-size="16" text-anchor="middle" fill="#2a2318" font-family="Arial, sans-serif" letter-spacing="1">tanya-islam.netlify.app</text>

  <!-- gold line bottom -->
  <line x1="0" y1="630" x2="1200" y2="630" stroke="#c9a84c" stroke-width="3"/>
</svg>
